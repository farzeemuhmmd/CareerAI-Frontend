<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerAI - Student Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #07111f, #102a43);
            color: white;
            padding: 30px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #b8c7d9;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.06);
            padding: 18px;
            border-radius: 12px;
        }

        .info-box .label {
            color: #8fa6bd;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .info-box .value {
            font-size: 17px;
            font-weight: bold;
            word-break: break-word;
        }

        .message {
            text-align: center;
            padding: 30px;
            color: #b8c7d9;
        }

        .error {
            color: #f87171;
        }

        .back-button {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            padding: 13px;
            text-align: center;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {

            .info {
                grid-template-columns: 1fr;
            }

            .profile-card {
                padding: 20px;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Student Profile</h1>
        <p>CareerAI Student Information</p>
    </div>

    <div class="profile-card">

        <div id="profileContent">

            <div class="message">
                Loading student profile...
            </div>

        </div>

    </div>

    <a href="admin.html" class="back-button">
        ← Back to Admin Panel
    </a>

</div>

<script>

    async function loadStudentProfile() {

        const profileContent =
            document.getElementById("profileContent");

        const urlParams =
            new URLSearchParams(window.location.search);

        const studentId =
            urlParams.get("id");

        if (!studentId) {

            profileContent.innerHTML = `
                <div class="message error">
                    Student ID was not provided.
                </div>
            `;

            return;
        }

        try {

            const response = await fetch(
                "https://careerai-r4qf.onrender.com/api/students/"
                + encodeURIComponent(studentId)
            );

            if (!response.ok) {

                throw new Error(
                    "Student could not be found."
                );
            }

            const student =
                await response.json();

            const firstLetter =
                student.name
                    ? student.name.charAt(0).toUpperCase()
                    : "S";

            profileContent.innerHTML = `

                <div class="profile-icon">
                    ${firstLetter}
                </div>

                <div class="info">

                    <div class="info-box">
                        <div class="label">
                            Student ID
                        </div>

                        <div class="value">
                            ${student.id ?? "N/A"}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">
                            Full Name
                        </div>

                        <div class="value">
                            ${student.name ?? "N/A"}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">
                            Email
                        </div>

                        <div class="value">
                            ${student.email ?? "N/A"}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">
                            Course
                        </div>

                        <div class="value">
                            ${student.course ?? "N/A"}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">
                            Academic Percentage
                        </div>

                        <div class="value">
                            ${student.academicPercentage ?? "N/A"}%
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">
                            Assessment
                        </div>

                        <div class="value">
                            Available through student dashboard
                        </div>
                    </div>

                </div>
            `;

        } catch (error) {

            profileContent.innerHTML = `
                <div class="message error">
                    ${error.message}
                </div>
            `;

        }
    }

    loadStudentProfile();

</script>

</body>
</html>
