<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | CareerAI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top right,#12345a,transparent 40%),
        #07111f;
    color:#fff;
    min-height:100vh;
}

.navbar{
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,17,31,.8);
}

.logo{
    font-size:25px;
    font-weight:800;
    background:linear-gradient(90deg,#6ee7ff,#38ef7d);
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.back{
    color:#6ee7ff;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:900px;
    margin:40px auto;
}

.header{
    margin-bottom:25px;
}

.header h1{
    font-size:34px;
    margin-bottom:8px;
}

.header p{
    color:#9fb0c3;
}

.profile-card{
    background:rgba(15,30,50,.92);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:30px;
}

.avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:800;
    background:linear-gradient(135deg,#6ee7ff,#38ef7d);
    color:#06101b;
    margin-bottom:22px;
}

.name{
    font-size:28px;
    font-weight:800;
    margin-bottom:6px;
}

.email{
    color:#9fb0c3;
    margin-bottom:28px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.info{
    padding:18px;
    border-radius:12px;
    background:#0b1929;
    border:1px solid #29415c;
}

.info-label{
    color:#8195aa;
    font-size:13px;
    margin-bottom:7px;
}

.info-value{
    font-size:17px;
    font-weight:700;
}

.skills-card{
    margin-top:20px;
    background:rgba(15,30,50,.92);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:25px;
}

.skills-card h2{
    margin-bottom:16px;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.skill{
    padding:9px 13px;
    border-radius:20px;
    background:rgba(110,231,255,.08);
    border:1px solid rgba(110,231,255,.2);
    color:#bcefff;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:40px;
}

.empty p{
    color:#9fb0c3;
    margin:12px 0 20px;
}

.button{
    display:inline-block;
    padding:13px 20px;
    border-radius:10px;
    background:linear-gradient(90deg,#6ee7ff,#38ef7d);
    color:#06101b;
    text-decoration:none;
    font-weight:800;
}

@media(max-width:600px){
    .header h1{
        font-size:28px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .profile-card{
        padding:22px;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">CareerAI</div>
    <a class="back" href="dashboard.html">Dashboard</a>
</nav>

<main class="container">

    <div class="header">
        <h1>My Profile</h1>
        <p>View your CareerAI student profile.</p>
    </div>

    <div id="content"></div>

</main>

<script>

const studentData =
    localStorage.getItem("careerAIStudent");

const content =
    document.getElementById("content");

if(!studentData){

    content.innerHTML = `
        <div class="profile-card empty">

            <h2>Login Required</h2>

            <p>
                Please login to view your profile.
            </p>

            <a class="button" href="login.html">
                Login
            </a>

        </div>
    `;

}else{

    const student =
        JSON.parse(studentData);

    const name =
        student.name || "Student";

    const initial =
        name.charAt(0).toUpperCase();

    content.innerHTML = `

        <div class="profile-card">

            <div class="avatar">
                ${initial}
            </div>

            <div class="name">
                ${name}
            </div>

            <div class="email">
                ${student.email || "No email available"}
            </div>

            <div class="info-grid">

                <div class="info">
                    <div class="info-label">
                        Student ID
                    </div>

                    <div class="info-value">
                        ${student.id || "--"}
                    </div>
                </div>

                <div class="info">
                    <div class="info-label">
                        Course
                    </div>

                    <div class="info-value">
                        ${student.course || "--"}
                    </div>
                </div>

                <div class="info">
                    <div class="info-label">
                        Academic Percentage
                    </div>

                    <div class="info-value">
                        ${
                            student.academicPercentage != null
                            ? student.academicPercentage + "%"
                            : "--"
                        }
                    </div>
                </div>

                <div class="info">
                    <div class="info-label">
                        Career Assessment
                    </div>

                    <div class="info-value"
                         id="assessmentStatus">
                        Not Completed
                    </div>
                </div>

            </div>

        </div>

        <div class="skills-card">

            <h2>Recommended Skills</h2>

            <div class="skills" id="skills">
                <span class="skill">Problem Solving</span>
                <span class="skill">Communication</span>
                <span class="skill">Technical Skills</span>
            </div>

        </div>
    `;

    const assessmentData =
        localStorage.getItem("careerAIAssessment");

    if(assessmentData){

        const assessment =
            JSON.parse(assessmentData);

        document.getElementById("assessmentStatus")
            .textContent =
                assessment.career || "Completed";

        if(
            Array.isArray(assessment.skills) &&
            assessment.skills.length > 0
        ){

            const skillsContainer =
                document.getElementById("skills");

            skillsContainer.innerHTML = "";

            assessment.skills.forEach(function(skill){

                const span =
                    document.createElement("span");

                span.className = "skill";
                span.textContent = skill;

                skillsContainer.appendChild(span);

            });

        }

    }

}

</script>

</body>
</html>
