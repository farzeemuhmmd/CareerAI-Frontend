<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | CareerAI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top right,#12345a,transparent 40%),
        #07111f;
    color:#fff;
    min-height:100vh;
}

.navbar{
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,17,31,.8);
}

.logo{
    font-size:25px;
    font-weight:800;
    background:linear-gradient(90deg,#6ee7ff,#38ef7d);
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.back{
    color:#6ee7ff;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1150px;
    margin:40px auto;
}

.header{
    margin-bottom:28px;
}

.header h1{
    font-size:34px;
    margin-bottom:8px;
}

.header p{
    color:#9fb0c3;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat{
    background:rgba(15,30,50,.9);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:24px;
}

.stat-label{
    color:#9fb0c3;
    font-size:14px;
    margin-bottom:10px;
}

.stat-value{
    font-size:30px;
    font-weight:800;
    color:#6ee7ff;
}

.table-card{
    background:rgba(15,30,50,.92);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:25px;
    overflow:hidden;
}

.table-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.table-header h2{
    font-size:22px;
}

.refresh{
    border:none;
    padding:10px 16px;
    border-radius:9px;
    background:linear-gradient(90deg,#6ee7ff,#38ef7d);
    color:#06101b;
    font-weight:800;
    cursor:pointer;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    padding:14px 12px;
    text-align:left;
    border-bottom:1px solid rgba(255,255,255,.07);
}

th{
    color:#6ee7ff;
    font-size:13px;
    text-transform:uppercase;
}

td{
    color:#d8e5f0;
}

.view{
    display:inline-block;
    padding:7px 11px;
    border-radius:7px;
    background:#0d2034;
    border:1px solid #29415c;
    color:#6ee7ff;
    text-decoration:none;
    font-size:13px;
}

.view:hover{
    border-color:#6ee7ff;
}

.message{
    text-align:center;
    color:#9fb0c3;
    padding:30px;
}

.error{
    color:#ff9696;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:28px;
    }

    .table-card{
        padding:18px;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">CareerAI Admin</div>
    <a class="back" href="../index.html">Home</a>
</nav>

<main class="container">

    <div class="header">
        <h1>Admin Dashboard</h1>
        <p>
            Manage and monitor registered CareerAI students.
        </p>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-label">
                Total Students
            </div>

            <div class="stat-value" id="totalStudents">
                --
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Average Academic Percentage
            </div>

            <div class="stat-value" id="averagePercentage">
                --
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Courses Represented
            </div>

            <div class="stat-value" id="courseCount">
                --
            </div>
        </div>

    </div>

    <div class="table-card">

        <div class="table-header">

            <h2>Registered Students</h2>

            <button
                class="refresh"
                onclick="loadStudents()">
                Refresh
            </button>

        </div>

        <div id="message" class="message">
            Loading students...
        </div>

        <div class="table-wrapper" id="tableWrapper"
             style="display:none;">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Academic %</th>
                        <th>Profile</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>

            </table>

        </div>

    </div>

</main>

<script>

const API_URL =
    "https://careerai-r4qf.onrender.com/api/students";

async function loadStudents(){

    const message =
        document.getElementById("message");

    const tableWrapper =
        document.getElementById("tableWrapper");

    const table =
        document.getElementById("studentTable");

    message.className = "message";
    message.textContent =
        "Loading students...";

    tableWrapper.style.display = "none";

    try{

        const response =
            await fetch(API_URL);

        if(!response.ok){
            throw new Error("Unable to load students.");
        }

        const students =
            await response.json();

        document.getElementById("totalStudents")
            .textContent = students.length;

        let totalPercentage = 0;

        const courses = new Set();

        students.forEach(function(student){

            totalPercentage +=
                Number(student.academicPercentage || 0);

            if(student.course){
                courses.add(student.course);
            }

        });

        const average =
            students.length > 0
            ? totalPercentage / students.length
            : 0;

        document.getElementById("averagePercentage")
            .textContent =
                average.toFixed(1) + "%";

        document.getElementById("courseCount")
            .textContent = courses.size;

        table.innerHTML = "";

        if(students.length === 0){

            message.textContent =
                "No students registered yet.";

            return;

        }

        students.forEach(function(student){

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>${student.id ?? "--"}</td>

                <td>${escapeHTML(student.name)}</td>

                <td>${escapeHTML(student.email)}</td>

                <td>${escapeHTML(student.course)}</td>

                <td>
                    ${student.academicPercentage ?? "--"}%
                </td>

                <td>
                    <a
                        class="view"
                        href="profile.html?id=${student.id}">
                        View
                    </a>
                </td>
            `;

            table.appendChild(row);

        });

        message.style.display = "none";
        tableWrapper.style.display = "block";

    }catch(error){

        message.className =
            "message error";

        message.textContent =
            "Unable to connect to the CareerAI server.";

        console.error(error);

    }

}

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

loadStudents();

</script>

</body>
</html>
