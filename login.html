<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CareerAI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top right,#12345a,transparent 40%),
        #07111f;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:430px;
    background:rgba(15,30,50,.92);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:35px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    margin-bottom:8px;
    background:linear-gradient(90deg,#6ee7ff,#38ef7d);
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    text-align:center;
    color:#9fb0c3;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#dbe7f3;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #29415c;
    background:#0b1929;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#6ee7ff;
    box-shadow:0 0 0 3px rgba(110,231,255,.08);
}

button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:10px;
    background:linear-gradient(90deg,#6ee7ff,#38ef7d);
    color:#06101b;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
    margin-top:5px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:14px;
}

.success{
    display:block;
    background:rgba(56,239,125,.12);
    border:1px solid rgba(56,239,125,.3);
    color:#7ff0a5;
}

.error{
    display:block;
    background:rgba(255,80,80,.12);
    border:1px solid rgba(255,80,80,.3);
    color:#ff9696;
}

.links{
    text-align:center;
    margin-top:22px;
    color:#9fb0c3;
    font-size:14px;
    line-height:1.8;
}

.links a{
    color:#6ee7ff;
    text-decoration:none;
}

.links a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">CareerAI</div>

    <p class="subtitle">
        Login to continue your career journey
    </p>

    <form id="loginForm">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">
        Don't have an account?
        <a href="register.html">Create Account</a>

        <br>

        <a href="../index.html">Back to Home</a>
    </div>

</div>

<script>
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.className = "message";
    message.textContent = "";

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";

    try {

        const response = await fetch(
            "https://careerai-r4qf.onrender.com/api/students/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                errorText || "Invalid email or password."
            );
        }

        const student =
            await response.json();

        localStorage.setItem(
            "careerAIStudent",
            JSON.stringify(student)
        );

        message.className =
            "message success";

        message.textContent =
            "Login successful! Welcome " +
            student.name;

        setTimeout(function() {

            window.location.href =
                "dashboard.html";

        }, 800);

    } catch (error) {

        message.className =
            "message error";

        if (error.message === "Failed to fetch") {

            message.textContent =
                "Unable to connect to CareerAI server. Please try again.";

        } else {

            message.textContent =
                "Invalid email or password.";

        }

        console.error(error);

    } finally {

        button.disabled = false;
        button.textContent = "Login";
    }

});
</script>

</body>
</html>
