<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerAI - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #07111f, #102a43);
            color: white;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.08);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #b8c7d9;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: none;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            outline: none;
            font-size: 15px;
        }

        input::placeholder {
            color: #b8c7d9;
        }

        input:focus {
            outline: 2px solid #4da3ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #b8c7d9;
        }

        .register-link a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #b8c7d9;
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">CareerAI</div>

        <div class="subtitle">
            AI-Based Career Guidance System
        </div>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

    <script>
        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                message.textContent = "Logging in...";
                message.style.color = "#b8c7d9";

                try {

                    const response = await fetch(
                        "https://careerai-r4qf.onrender.com/api/students/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );

                    if (!response.ok) {

                        const errorText =
                            await response.text();

                        throw new Error(
                            errorText ||
                            "Invalid email or password"
                        );
                    }

                    const student =
                        await response.json();

                    localStorage.setItem(
                        "careerAIStudent",
                        JSON.stringify(student)
                    );

                    message.textContent =
                        "Login successful!";

                    message.style.color = "#4ade80";

                    setTimeout(function() {
                        window.location.href =
                            "dashboard.html";
                    }, 700);

                } catch (error) {

                    message.textContent =
                        error.message ||
                        "Login failed. Please try again.";

                    message.style.color = "#f87171";
                }

            });
    </script>

</body>
</html>
