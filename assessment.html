<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Career Assessment - CareerAI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#07111f;
            color:white;
            min-height:100vh;
        }

        .navbar{
            padding:20px 7%;
            background:#0b1728;
            border-bottom:1px solid #203650;
        }

        .logo{
            font-size:24px;
            font-weight:bold;
            color:#38bdf8;
        }

        .container{
            width:90%;
            max-width:850px;
            margin:40px auto;
        }

        .header{
            text-align:center;
            margin-bottom:30px;
        }

        .header h1{
            font-size:36px;
            margin-bottom:10px;
        }

        .header p{
            color:#a9b8ca;
            line-height:1.6;
        }

        .progress-box{
            background:#0d1b2e;
            border:1px solid #203650;
            padding:18px;
            border-radius:12px;
            margin-bottom:20px;
        }

        .progress-text{
            display:flex;
            justify-content:space-between;
            margin-bottom:10px;
            color:#a9b8ca;
        }

        .progress-bar{
            width:100%;
            height:8px;
            background:#1d3048;
            border-radius:20px;
            overflow:hidden;
        }

        .progress{
            width:5%;
            height:100%;
            background:#38bdf8;
            transition:.3s ease;
        }

        .question-card{
            background:#0d1b2e;
            border:1px solid #203650;
            border-radius:18px;
            padding:30px;
        }

        .question{
            font-size:23px;
            line-height:1.5;
            margin-bottom:25px;
        }

        .options{
            display:grid;
            gap:12px;
        }

        .option{
            display:block;
            width:100%;
            text-align:left;
            padding:16px;
            border:1px solid #294665;
            border-radius:10px;
            background:#102239;
            color:white;
            cursor:pointer;
            transition:.2s ease;
            font-size:15px;
        }

        .option:hover{
            border-color:#38bdf8;
            background:#142b45;
        }

        .option.selected{
            border-color:#38bdf8;
            background:#123c59;
        }

        .buttons{
            display:flex;
            justify-content:space-between;
            gap:15px;
            margin-top:25px;
        }

        button{
            border:none;
            cursor:pointer;
            padding:13px 22px;
            border-radius:9px;
            font-weight:bold;
            font-size:15px;
        }

        .previous{
            background:#1b2d43;
            color:white;
        }

        .next{
            background:#38bdf8;
            color:#06111d;
        }

        .result{
            text-align:center;
        }

        .result h2{
            color:#38bdf8;
            font-size:32px;
            margin-bottom:15px;
        }

        .score{
            font-size:22px;
            margin:20px 0;
        }

        .description{
            color:#b9c8d9;
            line-height:1.7;
            margin-bottom:25px;
        }

        .skills{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:10px;
        }

        .skill{
            background:#142943;
            border:1px solid #294665;
            padding:9px 14px;
            border-radius:20px;
        }

        .dashboard-btn{
            display:inline-block;
            margin-top:30px;
            padding:13px 20px;
            background:#38bdf8;
            color:#06111d;
            text-decoration:none;
            border-radius:9px;
            font-weight:bold;
        }

        @media(max-width:600px){

            .header h1{
                font-size:29px;
            }

            .question{
                font-size:20px;
            }

            .question-card{
                padding:22px;
            }

        }

    </style>

</head>

<body>

/* =========================

========================= */

/* =========================
   STATE
========================= */

let currentQuestion = 0;

let answers = [];


/* =========================
   DISPLAY
========================= */

function showQuestion(){

    const area =
        document.getElementById("assessmentArea");

    const q =
        questions[currentQuestion];

    const selected =
        answers[currentQuestion];


    area.innerHTML = `

        <div class="progress-box">

            <div class="progress-text">

                <span>
                    Question ${currentQuestion + 1}
                    of ${questions.length}
                </span>

                <span>
                    ${Math.round(
                        ((currentQuestion + 1) /
                        questions.length) * 100
                    )}%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress"
                    style="width:${
                        ((currentQuestion + 1) /
                        questions.length) * 100
                    }%">
                </div>

            </div>

        </div>


        <div class="question-card">

            <div class="question">
                ${q.question}
            </div>

            <div class="options">

                ${q.options.map(
                    function(option,index){

                        return `

                            <button
                                class="option ${
                                    selected === option[1]
                                    ? "selected"
                                    : ""
                                }"
                                onclick="selectAnswer(
                                    '${option[1]}',
                                    this
                                )">

                                ${option[0]}

                            </button>

                        `;

                    }
                ).join("")}

            </div>


            <div class="buttons">

                <button
                    class="previous"
                    onclick="previousQuestion()"
                    ${currentQuestion === 0 ? "disabled" : ""}>

                    Previous

                </button>


                <button
                    class="next"
                    onclick="nextQuestion()">

                    ${
                        currentQuestion === questions.length - 1
                        ? "Finish Assessment"
                        : "Next"
                    }

                </button>

            </div>

        </div>

    `;

}


function selectAnswer(value,button){

    answers[currentQuestion] = value;

    document
        .querySelectorAll(".option")
        .forEach(function(option){

            option.classList.remove("selected");

        });

    button.classList.add("selected");

}


function nextQuestion(){

    if(!answers[currentQuestion]){

        alert("Please select an answer.");

        return;

    }


    if(currentQuestion <
        questions.length - 1){

        currentQuestion++;

        showQuestion();

    }else{

        calculateResult();

    }

}


function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

    }

}


/* =========================
   CALCULATE RESULT
========================= */

function calculateResult(){

    const scores = {};


    Object.keys(careers).forEach(
        function(career){

            scores[career] = 0;

        }
    );


    answers.forEach(
        function(answer){

            Object.keys(careers).forEach(
                function(careerName){

                    const career =
                        careers[careerName];

                    if(
                        career.keys.includes(answer)
                    ){

                        scores[careerName] += 1;

                    }

                }
            );

        }
    );


    /*
       Extra weighting for highly specific
       career answers.
    */

    const specialWeights = {

        "cybersecurity": "Cybersecurity Specialist",

        "cloud": "Cloud Engineer",

        "ai": "AI / Machine Learning Engineer",

        "design": "UI/UX Designer",

        "nurse": "Nurse",

        "pharmacy": "Pharmacist",

        "physiotherapy": "Physiotherapist",

        "medical": "Doctor / Medical Professional",

        "teacher": "Teacher / Educator",

        "business": "Business Analyst"

    };


    answers.forEach(
        function(answer){

            if(specialWeights[answer]){

                scores[
                    specialWeights[answer]
                ] += 2;

            }

        }
    );


    let bestCareer = "";

    let bestScore = -1;


    Object.keys(scores).forEach(
        function(careerName){

            if(
                scores[careerName] > bestScore
            ){

                bestScore =
                    scores[careerName];

                bestCareer =
                    careerName;

            }

        }
    );


    const career =
        careers[bestCareer];


    const maximumPossible =
        Math.max(questions.length,1);


    let percentage =
        Math.round(
            (bestScore / maximumPossible) * 100
        );


    percentage =
        Math.min(
            Math.max(percentage,40),
            98
        );


    const assessment = {

        career:bestCareer,

        score:percentage,

        description:career.description,

        skills:career.skills

    };


    localStorage.setItem(
        "careerAIAssessment",
        JSON.stringify(assessment)
    );


    showResult(assessment);

}


/* =========================
   RESULT
========================= */

function showResult(assessment){

    const area =
        document.getElementById("assessmentArea");


    area.innerHTML = `

        <div class="question-card result">

            <h2>
                ${assessment.career}
            </h2>

            <div class="score">
                Match Score:
                <strong>
                    ${assessment.score}%
                </strong>
            </div>

            <p class="description">
                ${assessment.description}
            </p>

            <h3 style="margin-bottom:15px;">
                Recommended Skills
            </h3>

            <div class="skills">

                ${assessment.skills.map(
                    function(skill){

                        return `

                            <span class="skill">
                                ${skill}
                            </span>

                        `;

                    }
                ).join("")}

            </div>


            <a
                href="recommendations.html"
                class="dashboard-btn">

                View Career Recommendation

            </a>

        </div>

    `;

}


/* =========================
   START
========================= */
