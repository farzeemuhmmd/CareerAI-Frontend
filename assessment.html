<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerAI - Career Assessment</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #07111f, #102a43);
            color: white;
            padding: 30px 20px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .header p {
            color: #b8c7d9;
            line-height: 1.6;
        }

        .progress-container {
            background: rgba(255,255,255,.08);
            height: 8px;
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width .3s ease;
        }

        .question-card {
            background: rgba(255,255,255,.08);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,.3);
            backdrop-filter: blur(12px);
        }

        .question-number {
            color: #60a5fa;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .question {
            font-size: 23px;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 16px;
            border-radius: 10px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            cursor: pointer;
            transition: .2s ease;
        }

        .option:hover {
            background: rgba(37,99,235,.25);
            border-color: #3b82f6;
        }

        .option.selected {
            background: #2563eb;
            border-color: #60a5fa;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            padding: 13px 24px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .result {
            display: none;
            background: rgba(255,255,255,.08);
            border-radius: 18px;
            padding: 35px;
            text-align: center;
        }

        .result h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .score {
            color: #60a5fa;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .description {
            color: #c5d2df;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .skill {
            background: rgba(37,99,235,.25);
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 14px;
        }

        .result a {
            display: inline-block;
            padding: 13px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
            margin: 5px;
        }

        .home-link {
            background: #334155 !important;
        }

        @media(max-width:600px) {

            .question-card,
            .result {
                padding: 22px;
            }

            .question {
                font-size: 19px;
            }

            .navigation {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Career Assessment</h1>

        <p>
            Answer these questions based on your genuine interests,
            strengths and preferred work style.
        </p>
    </div>

    <div id="assessmentArea">

        <div class="progress-container">
            <div id="progress" class="progress"></div>
        </div>

        <div class="question-card">

            <div id="question" class="question"></div>

            <div id="options" class="options"></div>

            <div class="navigation">

                <button
                    id="previousButton"
                    onclick="previousQuestion()">
                    Previous
                </button>

                <button
                    id="nextButton"
                    onclick="nextQuestion()">
                    Next
                </button>

            </div>

        </div>

    </div>

    <div id="result" class="result"></div>

</div>

let currentQuestion = 0;

let answers = [];


function showQuestion() {

    const question =
        questions[currentQuestion];

    document.getElementById("questionNumber")
        .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document.getElementById("question")
        .textContent =
        question.question;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    question.options.forEach(
        function(option, index) {

            const div =
                document.createElement("div");

            div.className = "option";

            div.textContent = option[0];

            if (
                answers[currentQuestion] ===
                option[1]
            ) {
                div.classList.add("selected");
            }

            div.onclick = function() {

                answers[currentQuestion] =
                    option[1];

                document
                    .querySelectorAll(".option")
                    .forEach(
                        function(item) {
                            item.classList.remove(
                                "selected"
                            );
                        }
                    );

                div.classList.add("selected");
            };

            optionsContainer.appendChild(div);
        }
    );

    document.getElementById("progress")
        .style.width =
        (
            (currentQuestion + 1) /
            questions.length *
            100
        ) + "%";

    document.getElementById("previousButton")
        .disabled =
        currentQuestion === 0;

    document.getElementById("nextButton")
        .textContent =
        currentQuestion ===
        questions.length - 1
            ? "Get My Career"
            : "Next";
}


function nextQuestion() {

    if (!answers[currentQuestion]) {

        alert(
            "Please select an answer before continuing."
        );

        return;
    }

    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

    } else {

        calculateResult();

    }
}


function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();
    }
}


function calculateResult() {

    const scores = {};

    Object.keys(careers)
        .forEach(
            function(career) {
                scores[career] = 0;
            }
        );


    answers.forEach(
        function(answer) {

            Object.keys(careers)
                .forEach(
                    function(career) {

                        if (
                            careers[career]
                                .keys
                                .includes(answer)
                        ) {

                            scores[career]++;

                        }

                    }
                );

        }
    );


    let recommendedCareer =
        Object.keys(scores)[0];

    Object.keys(scores)
        .forEach(
            function(career) {

                if (
                    scores[career] >
                    scores[recommendedCareer]
                ) {

                    recommendedCareer =
                        career;

                }

            }
        );


    const maxPossible =
        questions.length;

    const rawScore =
        scores[recommendedCareer];

    const percentage =
        Math.round(
            (
                rawScore /
                maxPossible
            ) * 100
        );


    const career =
        careers[recommendedCareer];


    const assessment = {

        career:
            recommendedCareer,

        score:
            percentage,

        description:
            career.description,

        skills:
            career.skills
    };


    localStorage.setItem(
        "careerAIAssessment",
        JSON.stringify(assessment)
    );


    document.getElementById("assessmentArea")
        .style.display = "none";


    const result =
        document.getElementById("result");

    result.style.display = "block";


    result.innerHTML = `

        <h2>
            Your Recommended Career
        </h2>

        <div class="score">
            ${recommendedCareer}
            <br>
            ${percentage}% Match
        </div>

        <div class="description">
            ${career.description}
        </div>

        <div class="skills">

            ${career.skills.map(
                function(skill) {
                    return `
                        <span class="skill">
                            ${skill}
                        </span>
                    `;
                }
            ).join("")}

        </div>

        <a href="recommendations.html">
            View Recommendation
        </a>

        <a
            href="dashboard.html"
            class="home-link">
            Dashboard
        </a>
    `;
}


showQuestion();
