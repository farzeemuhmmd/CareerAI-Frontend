<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Roadmap - CareerAI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#07111f;
            color:white;
            min-height:100vh;
        }

        .navbar{
            padding:20px 7%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#0b1728;
            border-bottom:1px solid #203650;
        }

        .logo{
            font-size:24px;
            font-weight:bold;
            color:#38bdf8;
        }

        .back{
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border:1px solid #334b66;
            border-radius:8px;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:45px auto;
        }

        .hero{
            text-align:center;
            margin-bottom:35px;
        }

        .hero h1{
            font-size:38px;
            margin-bottom:10px;
        }

        .hero p{
            color:#a9b8ca;
        }

        .card{
            background:#0d1b2e;
            border:1px solid #203650;
            border-radius:18px;
            padding:30px;
            margin-bottom:25px;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        .career-name{
            color:#38bdf8;
            font-size:30px;
            margin-bottom:30px;
        }

        .step{
            display:flex;
            gap:18px;
            margin-bottom:25px;
        }

        .number{
            min-width:42px;
            height:42px;
            border-radius:50%;
            background:#38bdf8;
            color:#06111d;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
        }

        .step h3{
            margin-bottom:7px;
        }

        .step p{
            color:#aebed0;
            line-height:1.6;
        }

        .section-title{
            font-size:20px;
            margin:30px 0 15px;
        }

        .skills{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .skill{
            background:#142943;
            border:1px solid #294665;
            padding:9px 14px;
            border-radius:20px;
            color:#d9efff;
        }

        .btn{
            display:inline-block;
            margin-top:30px;
            padding:13px 20px;
            border-radius:9px;
            background:#38bdf8;
            color:#06111d;
            text-decoration:none;
            font-weight:bold;
        }

        .empty{
            text-align:center;
            padding:45px 20px;
        }

        @media(max-width:600px){

            .hero h1{
                font-size:30px;
            }

            .career-name{
                font-size:25px;
            }

            .card{
                padding:22px;
            }

        }

    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        CareerAI
    </div>

    <a href="dashboard.html" class="back">
        Dashboard
    </a>

</nav>


<div class="container">

    <div class="hero">

        <h1>
            Career Roadmap
        </h1>

        <p>
            Your personalized path toward your recommended career
        </p>

    </div>


    <div id="roadmap"></div>

</div>


<script>

const assessmentData =
    localStorage.getItem("careerAIAssessment");


const roadmapContainer =
    document.getElementById("roadmap");


const roadmaps = {

    "Software Developer": {

        steps:[
            "Learn programming fundamentals",
            "Build web and software projects",
            "Learn databases and APIs",
            "Practice Data Structures and Algorithms",
            "Build a professional project portfolio"
        ],

        skills:[
            "Programming",
            "Java",
            "Python",
            "Web Development",
            "SQL",
            "Problem Solving"
        ]

    },


    "Data Analyst": {

        steps:[
            "Learn Excel and data fundamentals",
            "Learn SQL and statistics",
            "Practice data cleaning",
            "Learn data visualization",
            "Build data analysis projects"
        ],

        skills:[
            "Statistics",
            "Excel",
            "SQL",
            "Data Analysis",
            "Visualization",
            "Critical Thinking"
        ]

    },


    "AI / Machine Learning Engineer": {

        steps:[
            "Learn Python and mathematics",
            "Study statistics and machine learning",
            "Practice with datasets",
            "Learn deep learning concepts",
            "Build AI and machine learning projects"
        ],

        skills:[
            "Python",
            "Machine Learning",
            "Mathematics",
            "Statistics",
            "Data Science",
            "Problem Solving"
        ]

    },


    "Cybersecurity Specialist": {

        steps:[
            "Learn computer networking",
            "Learn Linux fundamentals",
            "Study cybersecurity concepts",
            "Practice security analysis",
            "Build cybersecurity projects"
        ],

        skills:[
            "Networking",
            "Linux",
            "Cybersecurity",
            "Security Analysis",
            "Problem Solving",
            "Risk Management"
        ]

    },


    "UI/UX Designer": {

        steps:[
            "Learn design principles",
            "Study UI and UX research",
            "Learn wireframing and prototyping",
            "Create mobile and web designs",
            "Build a professional design portfolio"
        ],

        skills:[
            "UI Design",
            "UX Research",
            "Wireframing",
            "Prototyping",
            "Creativity",
            "Communication"
        ]

    },


    "Cloud Engineer": {

        steps:[
            "Learn Linux and networking",
            "Study cloud computing fundamentals",
            "Learn AWS, Azure or Google Cloud",
            "Practice DevOps and deployment",
            "Build cloud infrastructure projects"
        ],

        skills:[
            "Cloud Computing",
            "Networking",
            "Linux",
            "DevOps",
            "Security",
            "Problem Solving"
        ]

    },


    "Doctor / Medical Professional": {

        steps:[
            "Build strong Biology and Chemistry knowledge",
            "Prepare for medical entrance examinations",
            "Complete medical education",
            "Develop clinical skills",
            "Complete internship and specialization"
        ],

        skills:[
            "Biology",
            "Anatomy",
            "Clinical Reasoning",
            "Patient Care",
            "Communication",
            "Decision Making"
        ]

    },


    "Nurse": {

        steps:[
            "Build Biology and healthcare knowledge",
            "Complete nursing education",
            "Develop clinical skills",
            "Gain hospital experience",
            "Pursue nursing specialization"
        ],

        skills:[
            "Patient Care",
            "Communication",
            "Empathy",
            "Clinical Skills",
            "Teamwork",
            "Attention to Detail"
        ]

    },


    "Pharmacist": {

        steps:[
            "Strengthen Chemistry and Biology",
            "Study pharmacy fundamentals",
            "Learn pharmacology and medicines",
            "Complete practical training",
            "Gain pharmacy experience"
        ],

        skills:[
            "Pharmacology",
            "Chemistry",
            "Biology",
            "Medicine Knowledge",
            "Accuracy",
            "Patient Counselling"
        ]

    },


    "Medical Laboratory Technologist": {

        steps:[
            "Study Biology and Chemistry",
            "Learn laboratory techniques",
            "Practice diagnostic testing",
            "Develop scientific analysis skills",
            "Gain clinical laboratory experience"
        ],

        skills:[
            "Biology",
            "Chemistry",
            "Laboratory Techniques",
            "Scientific Reasoning",
            "Data Analysis",
            "Accuracy"
        ]

    },


    "Physiotherapist": {

        steps:[
            "Study Biology and Human Anatomy",
            "Learn exercise and rehabilitation science",
            "Develop patient-care skills",
            "Complete clinical training",
            "Gain rehabilitation experience"
        ],

        skills:[
            "Human Anatomy",
            "Exercise Science",
            "Patient Care",
            "Communication",
            "Observation",
            "Empathy"
        ]

    },


    "Biotechnology / Life Science Professional": {

        steps:[
            "Build Biology and Chemistry fundamentals",
            "Study biotechnology and genetics",
            "Learn laboratory techniques",
            "Participate in research projects",
            "Develop a life-science specialization"
        ],

        skills:[
            "Biology",
            "Genetics",
            "Laboratory Techniques",
            "Research",
            "Data Analysis",
            "Scientific Reasoning"
        ]

    },


    "Teacher / Educator": {

        steps:[
            "Develop strong subject knowledge",
            "Study teaching and learning methods",
            "Practice communication and presentation",
            "Gain classroom experience",
            "Pursue teaching certification"
        ],

        skills:[
            "Communication",
            "Teaching",
            "Presentation",
            "Subject Knowledge",
            "Patience",
            "Classroom Management"
        ]

    },


    "Lecturer / Academic Researcher": {

        steps:[
            "Build strong subject expertise",
            "Complete higher education",
            "Develop academic writing skills",
            "Conduct academic research",
            "Publish research and teach"
        ],

        skills:[
            "Research",
            "Teaching",
            "Academic Writing",
            "Communication",
            "Critical Thinking",
            "Subject Expertise"
        ]

    },


    "Business Analyst": {

        steps:[
            "Learn business fundamentals",
            "Develop data analysis skills",
            "Learn SQL and visualization",
            "Study business processes",
            "Build analytical projects"
        ],

        skills:[
            "Data Analysis",
            "Communication",
            "Problem Solving",
            "Business Knowledge",
            "Critical Thinking",
            "Documentation"
        ]

    },


    "Research Scientist": {

        steps:[
            "Build strong science fundamentals",
            "Learn scientific research methods",
            "Develop laboratory skills",
            "Conduct research projects",
            "Publish findings and specialize"
        ],

        skills:[
            "Research",
            "Scientific Method",
            "Biology",
            "Laboratory Skills",
            "Data Analysis",
            "Critical Thinking"
        ]

    }

};


if(!assessmentData){

    roadmapContainer.innerHTML = `

        <div class="card empty">

            <h2>
                No Assessment Found
            </h2>

            <p style="margin-top:15px;color:#aebed0;">
                Complete the career assessment first.
            </p>

            <a
                href="assessment.html"
                class="btn">

                Take Assessment

            </a>

        </div>

    `;

}else{

    const assessment =
        JSON.parse(assessmentData);


    const career =
        assessment.career;


    const roadmap =
        roadmaps[career];


    if(!roadmap){

        roadmapContainer.innerHTML = `

            <div class="card empty">

                <h2>
                    Roadmap Not Available
                </h2>

                <p style="margin-top:15px;color:#aebed0;">
                    Please retake the assessment.
                </p>

                <a
                    href="assessment.html"
                    class="btn">

                    Retake Assessment

                </a>

            </div>

        `;

    }else{

        roadmapContainer.innerHTML = `

            <div class="card">

                <div class="career-name">
                    ${career}
                </div>


                ${roadmap.steps.map(
                    function(step,index){

                        return `

                            <div class="step">

                                <div class="number">
                                    ${index + 1}
                                </div>

                                <div>

                                    <h3>
                                        ${step}
                                    </h3>

                                    <p>
                                        Focus on this stage to build the knowledge and experience required for your career.
                                    </p>

                                </div>

                            </div>

                        `;

                    }
                ).join("")}


                <div class="section-title">
                    Key Skills
                </div>


                <div class="skills">

                    ${roadmap.skills.map(
                        function(skill){

                            return `

                                <span class="skill">
                                    ${skill}
                                </span>

                            `;

                        }
                    ).join("")}

                </div>


                <a
                    href="recommendations.html"
                    class="btn">

                    Back to Recommendation

                </a>

            </div>

        `;

    }

}

</script>

</body>
</html>
