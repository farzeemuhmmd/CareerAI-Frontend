<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recommendations | CareerAI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top right,#12345a,transparent 40%),
        #07111f;
    color:#fff;
    min-height:100vh;
}

.navbar{
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,17,31,.8);
}

.logo{
    font-size:25px;
    font-weight:800;
    background:linear-gradient(90deg,#6ee7ff,#38ef7d);
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.back{
    color:#6ee7ff;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1050px;
    margin:40px auto;
}

.header{
    margin-bottom:28px;
}

.header h1{
    font-size:34px;
    margin-bottom:8px;
}

.header p{
    color:#9fb0c3;
    line-height:1.6;
}

.main-card{
    background:rgba(15,30,50,.92);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:30px;
    margin-bottom:25px;
}

.main-card h2{
    color:#9fb0c3;
    font-size:15px;
    margin-bottom:12px;
}

.career{
    font-size:32px;
    font-weight:800;
    color:#6ee7ff;
    margin-bottom:14px;
}

.description{
    color:#b7c7d8;
    line-height:1.7;
}

.score-box{
    margin-top:24px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.score{
    font-size:25px;
    font-weight:800;
    color:#38ef7d;
}

.progress{
    flex:1;
    min-width:200px;
    height:10px;
    background:#16283c;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#6ee7ff,#38ef7d);
    transition:1s;
}

.section-title{
    margin-bottom:16px;
    font-size:22px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.card{
    background:rgba(15,30,50,.88);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:24px;
}

.card h3{
    margin-bottom:12px;
    font-size:20px;
}

.card p{
    color:#aebfd0;
    line-height:1.65;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:15px;
}

.skill{
    padding:8px 12px;
    border-radius:20px;
    background:rgba(110,231,255,.08);
    border:1px solid rgba(110,231,255,.2);
    color:#bcefff;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:45px 20px;
}

.empty h2{
    margin-bottom:12px;
}

.empty p{
    color:#9fb0c3;
    line-height:1.6;
    margin-bottom:20px;
}

.button{
    display:inline-block;
    padding:13px 20px;
    border-radius:10px;
    background:linear-gradient(90deg,#6ee7ff,#38ef7d);
    color:#06101b;
    text-decoration:none;
    font-weight:800;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:28px;
    }

    .career{
        font-size:27px;
    }

    .main-card{
        padding:22px;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">CareerAI</div>
    <a class="back" href="dashboard.html">Dashboard</a>
</nav>

<main class="container">

    <div class="header">
        <h1>Career Recommendations</h1>
        <p>
            Explore the career recommendation generated
            from your assessment results.
        </p>
    </div>

    <div id="content"></div>

</main>

<script>

const assessmentData =
    localStorage.getItem("careerAIAssessment");

const content =
    document.getElementById("content");

if(!assessmentData){

    content.innerHTML = `
        <div class="main-card empty">

            <h2>Assessment Not Completed</h2>

            <p>
                Complete the career assessment first
                to receive your personalized recommendation.
            </p>

            <a class="button" href="assessment.html">
                Take Assessment
            </a>

        </div>
    `;

}else{

    const assessment =
        JSON.parse(assessmentData);

    const career =
        assessment.career ||
        "Software Developer";

    const score =
        assessment.score || 0;

    const description =
        assessment.description ||
        "Explore this career path based on your assessment results.";

    const careerData = {

        "Software Developer":{
            overview:
                "Software developers design, build, test and maintain software applications and digital solutions.",
            skills:[
                "Java",
                "Programming",
                "Problem Solving",
                "Web Development",
                "Database"
            ]
        },

        "Data Analyst":{
            overview:
                "Data analysts examine data, identify patterns and communicate insights that can support business and technical decisions.",
            skills:[
                "Python",
                "SQL",
                "Excel",
                "Statistics",
                "Data Visualization"
            ]
        },

        "Cyber Security Specialist":{
            overview:
                "Cyber security specialists help protect systems, networks and information from security threats and vulnerabilities.",
            skills:[
                "Networking",
                "Linux",
                "Cyber Security",
                "Risk Analysis",
                "System Security"
            ]
        },

        "UI/UX Designer":{
            overview:
                "UI/UX designers create digital interfaces and user experiences that are useful, accessible and visually engaging.",
            skills:[
                "Figma",
                "Wireframing",
                "Prototyping",
                "User Research",
                "Visual Design"
            ]
        }

    };

    const data =
        careerData[career] ||
        careerData["Software Developer"];

    const skills =
        assessment.skills &&
        assessment.skills.length
        ? assessment.skills
        : data.skills;

    content.innerHTML = `

        <div class="main-card">

            <h2>Your Recommended Career</h2>

            <div class="career">
                ${career}
            </div>

            <p class="description">
                ${description}
            </p>

            <div class="score-box">

                <div class="score">
                    ${score}% Match
                </div>

                <div class="progress">
                    <div
                        class="progress-bar"
                        id="progressBar">
                    </div>
                </div>

            </div>

        </div>

        <h2 class="section-title">
            Career Overview
        </h2>

        <div class="grid">

            <div class="card">

                <h3>About This Career</h3>

                <p>
                    ${data.overview}
                </p>

            </div>

            <div class="card">

                <h3>Recommended Skills</h3>

                <div class="skills" id="skills"></div>

            </div>

        </div>

    `;

    const progressBar =
        document.getElementById("progressBar");

    setTimeout(function(){

        progressBar.style.width =
            Math.min(score,100) + "%";

    },100);

    const skillsContainer =
        document.getElementById("skills");

    skills.forEach(function(skill){

        const span =
            document.createElement("span");

        span.className = "skill";
        span.textContent = skill;

        skillsContainer.appendChild(span);

    });

}

</script>

</body>
</html>
