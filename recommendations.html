<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Recommendations - CareerAI</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Arial,sans-serif;
            background:#07111f;
            color:white;
            min-height:100vh;
        }

        .navbar{
            padding:20px 7%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#0b1728;
            border-bottom:1px solid #1d3048;
        }

        .logo{
            font-size:24px;
            font-weight:bold;
            color:#38bdf8;
        }

        .back{
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border:1px solid #334b66;
            border-radius:8px;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:50px auto;
        }

        .hero{
            text-align:center;
            margin-bottom:35px;
        }

        .hero h1{
            font-size:38px;
            margin-bottom:10px;
        }

        .hero p{
            color:#a9b8ca;
        }

        .card{
            background:#0d1b2e;
            border:1px solid #203650;
            border-radius:18px;
            padding:30px;
            margin-bottom:25px;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        .career-name{
            font-size:30px;
            color:#38bdf8;
            margin-bottom:18px;
        }

        .score{
            font-size:20px;
            margin-bottom:15px;
        }

        .bar{
            width:100%;
            height:12px;
            background:#1d3048;
            border-radius:20px;
            overflow:hidden;
            margin-bottom:25px;
        }

        .progress{
            height:100%;
            background:#38bdf8;
            width:0;
            transition:1s ease;
        }

        .section-title{
            font-size:20px;
            margin-bottom:12px;
            color:#e5f3ff;
        }

        .description{
            color:#b9c8d9;
            line-height:1.7;
            margin-bottom:25px;
        }

        .skills{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .skill{
            background:#142943;
            border:1px solid #294665;
            padding:9px 14px;
            border-radius:20px;
            color:#d9efff;
        }

        .actions{
            display:flex;
            gap:15px;
            flex-wrap:wrap;
            margin-top:30px;
        }

        .btn{
            text-decoration:none;
            padding:13px 20px;
            border-radius:9px;
            font-weight:bold;
        }

        .primary{
            background:#38bdf8;
            color:#06111d;
        }

        .secondary{
            border:1px solid #38526d;
            color:white;
        }

        .empty{
            text-align:center;
            padding:50px 20px;
        }

        @media(max-width:600px){

            .hero h1{
                font-size:30px;
            }

            .career-name{
                font-size:25px;
            }

            .card{
                padding:22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">CareerAI</div>
    <a href="dashboard.html" class="back">Dashboard</a>
</nav>

<div class="container">

    <div class="hero">
        <h1>Your Career Recommendation</h1>
        <p>Based on your interests, skills and assessment responses</p>
    </div>

    <div id="result"></div>

</div>

<script>

const assessmentData =
    localStorage.getItem("careerAIAssessment");

const resultContainer =
    document.getElementById("result");

if(!assessmentData){

    resultContainer.innerHTML = `
        <div class="card empty">
            <h2>No Assessment Found</h2>
            <p style="margin-top:15px;color:#a9b8ca;">
                Complete the career assessment first.
            </p>

            <div class="actions" style="justify-content:center;">
                <a href="assessment.html" class="btn primary">
                    Take Assessment
                </a>
            </div>
        </div>
    `;

}else{

    const assessment =
        JSON.parse(assessmentData);

    const career = assessment.career || "Career Recommendation";
    const score = Number(assessment.score || 0);
    const description =
        assessment.description ||
        "A suitable career path based on your assessment.";

    const skills =
        Array.isArray(assessment.skills)
            ? assessment.skills
            : [];

    resultContainer.innerHTML = `

        <div class="card">

            <div class="career-name">
                ${career}
            </div>

            <div class="score">
                Match Score: <strong>${score}%</strong>
            </div>

            <div class="bar">
                <div
                    class="progress"
                    id="progress">
                </div>
            </div>

            <div class="section-title">
                Career Overview
            </div>

            <div class="description">
                ${description}
            </div>

            <div class="section-title">
                Recommended Skills
            </div>

            <div class="skills">

                ${
                    skills.length
                    ?
                    skills.map(skill => `
                        <span class="skill">
                            ${skill}
                        </span>
                    `).join("")
                    :
                    `
                        <span class="skill">
                            Problem Solving
                        </span>

                        <span class="skill">
                            Communication
                        </span>

                        <span class="skill">
                            Critical Thinking
                        </span>
                    `
                }

            </div>

            <div class="actions">

                <a
                    href="roadmap.html"
                    class="btn primary">
                    View Career Roadmap
                </a>

                <a
                    href="assessment.html"
                    class="btn secondary">
                    Retake Assessment
                </a>

            </div>

        </div>
    `;

    setTimeout(function(){

        document.getElementById("progress").style.width =
            Math.min(Math.max(score,0),100) + "%";

    },100);
}

</script>

</body>
</html>
